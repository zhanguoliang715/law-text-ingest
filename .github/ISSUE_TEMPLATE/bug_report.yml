name: 问题反馈
description: 脚本报错、规则不适用、文档与实现不一致
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 贴命令与完整输出（含退出码）
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 你期望的结果
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: Windows 11 / Python 3.12
